name: CI Quality & Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov mypy ruff httpx

      - name: Run Ruff Linting & Formatting Check
        run: |
          ruff check backend
          ruff format --check backend

      - name: Run Mypy Strict Type Analysis
        run: |
          mypy --strict backend/app backend/tests

      - name: Run Pytest Test Suite
        run: |
          pytest -v backend/tests --cov=backend/app --cov-report=term-missing

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build
